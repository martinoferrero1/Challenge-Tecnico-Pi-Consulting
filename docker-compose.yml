services:
  api:
    image: challenge-rag-app
    build:
      context: .
    env_file:
      - .env
    environment:
      CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR:-/app/.chroma}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data:ro
      - chroma_data:/app/.chroma
    command: >
      sh -c "python -m app.scripts.index_document &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: challenge-rag-app
    build:
      context: .
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app/app
    depends_on:
      api:
        condition: service_healthy
    command: >
      streamlit run app/frontend/streamlit_app.py
      --server.address 0.0.0.0
      --server.port 8501

volumes:
  chroma_data:
